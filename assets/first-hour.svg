<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="ساعة تشير إلى أن الأدلة تُفقد في أول ستين دقيقة">
  <defs>
    <linearGradient id="fg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2B961"/><stop offset="1" stop-color="#E8A649"/></linearGradient>
    <filter id="fs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#22333B" flood-opacity=".13"/>
    </filter>
  </defs>

  <circle cx="360" cy="240" r="46" fill="#E76B6B" opacity=".12"/>
  <circle cx="58" cy="62" r="38" fill="#64ADB1" opacity=".15"/>

  <!-- الساعة -->
  <g filter="url(#fs)" transform="translate(140 58)">
    <circle cx="70" cy="70" r="70" fill="#ffffff"/>
    <circle cx="70" cy="70" r="70" fill="none" stroke="#EAF1F2" stroke-width="6"/>
    <!-- القوس الأول: الستون دقيقة الحرجة -->
    <path d="M70 4 A66 66 0 0 1 136 70" fill="none" stroke="url(#fg1)" stroke-width="10" stroke-linecap="round"/>
    <g stroke="#CFE2E3" stroke-width="3" stroke-linecap="round">
      <line x1="70" y1="18" x2="70" y2="26"/>
      <line x1="122" y1="70" x2="114" y2="70"/>
      <line x1="70" y1="122" x2="70" y2="114"/>
      <line x1="18" y1="70" x2="26" y2="70"/>
    </g>
    <line x1="70" y1="70" x2="70" y2="36" stroke="#22333B" stroke-width="5" stroke-linecap="round"/>
    <line x1="70" y1="70" x2="98" y2="82" stroke="#E8A649" stroke-width="5" stroke-linecap="round"/>
    <circle cx="70" cy="70" r="7" fill="#22333B"/>
  </g>

  <!-- أدلة تتساقط وتتلاشى -->
  <g>
    <rect x="42" y="164" width="46" height="56" rx="8" fill="#ffffff" stroke="#DCE7EA" stroke-width="2" opacity=".95"/>
    <rect x="52" y="178" width="26" height="5" rx="2.5" fill="#CFE2E3"/>
    <rect x="52" y="190" width="20" height="5" rx="2.5" fill="#DFEAEB"/>
    <rect x="52" y="202" width="24" height="5" rx="2.5" fill="#EAF1F2"/>

    <rect x="70" y="206" width="40" height="48" rx="8" fill="#ffffff" stroke="#E6EDEF" stroke-width="2" opacity=".6"/>
    <rect x="96" y="238" width="34" height="40" rx="8" fill="#ffffff" stroke="#EDF2F3" stroke-width="2" opacity=".33"/>
  </g>

  <!-- لافتة تحذير -->
  <g transform="translate(272 96)">
    <rect x="0" y="0" width="126" height="46" rx="14" fill="#E76B6B"/>
    <circle cx="27" cy="23" r="13" fill="#ffffff" opacity=".22"/>
    <line x1="27" y1="16" x2="27" y2="25" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="27" cy="30" r="1.9" fill="#ffffff"/>
    <rect x="50" y="15" width="60" height="6" rx="3" fill="#ffffff" opacity=".85"/>
    <rect x="50" y="26" width="40" height="5" rx="2.5" fill="#ffffff" opacity=".55"/>
  </g>

  <!-- قائمة تحقق -->
  <g transform="translate(268 170)">
    <rect x="0" y="0" width="130" height="88" rx="14" fill="#ffffff" filter="url(#fs)"/>
    <g>
      <circle cx="22" cy="24" r="9" fill="#4CAF93"/>
      <path d="M18 24 l3.4 3.4 l6 -6.6" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="38" y="20" width="72" height="7" rx="3.5" fill="#DFEAEB"/>
    </g>
    <g>
      <circle cx="22" cy="48" r="9" fill="#4CAF93" opacity=".55"/>
      <path d="M18 48 l3.4 3.4 l6 -6.6" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="38" y="44" width="56" height="7" rx="3.5" fill="#E7EEEF"/>
    </g>
    <g>
      <circle cx="22" cy="70" r="9" fill="none" stroke="#CFE2E3" stroke-width="2.4"/>
      <rect x="38" y="66" width="64" height="7" rx="3.5" fill="#EDF2F3"/>
    </g>
  </g>
</svg>
